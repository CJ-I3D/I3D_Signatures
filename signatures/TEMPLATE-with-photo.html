<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Invent 3D signature - TEMPLATE with photo</title>
</head>
<body style="margin:30px;font-family:Arial,Helvetica,sans-serif;">

<!--
=====================================================================
 INVENT 3D EMAIL SIGNATURE  -  HOW TO USE
=====================================================================
 1. Search this file for "CHANGE PER PERSON" - there are 4 spots:
      (1) PHOTO   (2) NAME   (3) JOB TITLE   (4) PHONE NUMBER
    Everything else is identical for every staff member.

 2. PHOTOS: add the person's photo (square, about 240 x 240px) to the
    "images" folder of the GitHub repo CJ-I3D/I3D_Signatures, then put
    its file name in the PHOTO spot below. Name photos like
    firstname-lastname.jpg (lowercase, no spaces).

 3. TO INSTALL: open this file in a browser, select the whole
    signature (click just before it, drag to the end), copy, and
    paste into your email program's signature settings.
=====================================================================
-->

<!-- ==================== SIGNATURE START ==================== -->

<!-- Outer table = the rounded gradient frame -->
<table cellpadding="0" cellspacing="0" border="0" bgcolor="#EB8446"
  style="border-collapse:separate;border-radius:16px;background-color:#EB8446;background-image:linear-gradient(135deg,#EBC03A,#EB8446,#E9525A);font-family:Arial,Helvetica,sans-serif;">
 <tr>
  <td style="padding:4px;">

   <!-- Inner table = white card -->
   <table cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff"
     style="border-collapse:separate;border-radius:12px;background-color:#ffffff;overflow:hidden;">
    <tr>

     <!-- ============ LEFT: PHOTO ON GRADIENT PANEL ============ -->
     <td width="130" align="center" valign="middle" bgcolor="#EB8446"
       style="width:130px;padding:20px 0;background-color:#EB8446;background-image:linear-gradient(135deg,#EBC03A,#EB8446,#E9525A);">

      <!-- >>> (1) CHANGE PER PERSON: PHOTO <<<
           Replace the src with this person's photo (square, about 200 x 200px, JPG or PNG).
           Update alt="" with their name too. Keep width/height at 96. -->
      <img src="https://raw.githubusercontent.com/CJ-I3D/I3D_Signatures/main/images/photo-placeholder.png" width="96" height="96" alt="PUT YOUR NAME HERE"
        style="display:block;width:96px;height:96px;border-radius:50%;border:4px solid #ffffff;">

     </td>

     <!-- ============ MIDDLE: DETAILS ============ -->
     <td valign="middle" style="padding:16px 24px 16px 22px;font-family:Arial,Helvetica,sans-serif;">

      <!-- >>> (2) CHANGE PER PERSON: NAME <<< -->
      <div style="font-size:20px;line-height:24px;font-weight:bold;color:#222222;">PUT YOUR NAME HERE</div>

      <!-- >>> (3) CHANGE PER PERSON: JOB TITLE <<< (keep it in CAPITALS) -->
      <div style="font-size:13px;line-height:18px;color:#777777;letter-spacing:0.5px;text-transform:uppercase;padding:2px 0 10px 0;">PUT YOUR TITLE HERE</div>

      <div style="font-size:13px;line-height:20px;color:#333333;">
       <b style="color:#EB8446;">Invent 3D Ltd</b><br>

       <!-- >>> (4) CHANGE PER PERSON: PHONE NUMBER <<<
            Change it in TWO places: the href (no spaces, e.g. tel:+35677058212)
            and the visible text between the > < -->
       <a href="tel:+35677058212" style="color:#333333;text-decoration:none;">+356 7705 8212</a>
      </div>

      <!-- Social icons (same for everyone - no changes needed) -->
      <table cellpadding="0" cellspacing="0" border="0" style="margin-top:12px;">
       <tr>
        <td style="padding-right:6px;"><a href="https://www.facebook.com/Invent3DLtd"><img src="https://raw.githubusercontent.com/CJ-I3D/I3D_Signatures/main/images/facebook.png" width="22" height="22" alt="Facebook" style="display:block;border:0;"></a></td>
        <td style="padding-right:6px;"><a href="https://www.instagram.com/weareinvent3d/"><img src="https://raw.githubusercontent.com/CJ-I3D/I3D_Signatures/main/images/instagram.png" width="22" height="22" alt="Instagram" style="display:block;border:0;"></a></td>
        <td style="padding-right:6px;"><a href="https://mt.linkedin.com/company/i3dltd"><img src="https://raw.githubusercontent.com/CJ-I3D/I3D_Signatures/main/images/linkedin.png" width="22" height="22" alt="LinkedIn" style="display:block;border:0;"></a></td>
        <td style="padding-right:6px;"><a href="https://www.youtube.com/@invent3d939"><img src="https://raw.githubusercontent.com/CJ-I3D/I3D_Signatures/main/images/youtube.png" width="22" height="22" alt="YouTube" style="display:block;border:0;"></a></td>
        <td><a href="https://invent3d.design/"><img src="https://raw.githubusercontent.com/CJ-I3D/I3D_Signatures/main/images/website.png" width="22" height="22" alt="Website" style="display:block;border:0;"></a></td>
       </tr>
      </table>

     </td>

     <!-- ============ RIGHT: LOGO (same for everyone) ============ -->
     <td valign="middle" style="padding:0 22px 0 0;">
      <a href="https://invent3d.design/"><img src="https://raw.githubusercontent.com/CJ-I3D/I3D_Signatures/main/images/logo.png" width="120" height="120" alt="Invent 3D" style="display:block;border:0;"></a>
     </td>

    </tr>
   </table>

  </td>
 </tr>
</table>

<!-- ==================== SIGNATURE END ==================== -->

</body>
</html>
